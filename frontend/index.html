<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MangaTrans</title>
    <style>
      html, body { height: 100%; margin: 0; background: #fff; }
      body {
        color: #0d0d0d;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #boot-skeleton { display: flex; height: 100%; min-height: 100vh; }
      .boot-sidebar {
        width: 240px;
        flex: 0 0 240px;
        border-right: 1px solid #e5e5e5;
        background: #f9f9f9;
        padding: 16px;
        box-sizing: border-box;
      }
      .boot-main { flex: 1; min-width: 0; }
      .boot-header {
        height: 60px;
        border-bottom: 1px solid #e5e5e5;
        display: flex;
        align-items: center;
        padding: 0 24px;
      }
      .boot-content { max-width: 768px; margin: 0 auto; padding: 32px 24px; }
      .boot-bar {
        border-radius: 7px;
        background: #ececec;
        animation: boot-pulse 1.2s ease-in-out infinite;
      }
      .boot-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
      .boot-loading { margin-top: 28px; text-align: center; color: #6b6b6b; font-size: 14px; }
      @keyframes boot-pulse {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-skeleton" role="status" aria-live="polite" aria-label="加载中">
        <aside class="boot-sidebar">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:20px">
            <div class="boot-bar" style="width:20px;height:20px;border-radius:6px"></div>
            <div class="boot-bar" style="width:104px;height:14px"></div>
          </div>
          <div class="boot-bar" style="width:100%;height:36px;margin-bottom:8px"></div>
          <div class="boot-bar" style="width:100%;height:36px;margin-bottom:8px"></div>
          <div class="boot-bar" style="width:100%;height:36px;margin-bottom:8px"></div>
          <div class="boot-bar" style="width:100%;height:36px;margin-bottom:8px"></div>
        </aside>
        <main class="boot-main">
          <header class="boot-header">
            <div class="boot-bar" style="width:54px;height:20px"></div>
            <div class="boot-bar" style="width:280px;height:34px;margin:0 auto"></div>
            <div class="boot-bar" style="width:72px;height:32px"></div>
          </header>
          <section class="boot-content">
            <div class="boot-row">
              <div class="boot-bar" style="width:36px;height:36px"></div>
              <div style="flex:1">
                <div class="boot-bar" style="width:42%;height:14px;margin-bottom:8px"></div>
                <div class="boot-bar" style="width:68%;height:11px"></div>
              </div>
            </div>
            <div class="boot-row">
              <div class="boot-bar" style="width:36px;height:36px"></div>
              <div style="flex:1">
                <div class="boot-bar" style="width:55%;height:14px;margin-bottom:8px"></div>
                <div class="boot-bar" style="width:74%;height:11px"></div>
              </div>
            </div>
            <div class="boot-row">
              <div class="boot-bar" style="width:36px;height:36px"></div>
              <div style="flex:1">
                <div class="boot-bar" style="width:36%;height:14px;margin-bottom:8px"></div>
                <div class="boot-bar" style="width:62%;height:11px"></div>
              </div>
            </div>
            <p class="boot-loading">加载中···</p>
          </section>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
