name: release-windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify updater signing secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "缺少 GitHub Secret TAURI_SIGNING_PRIVATE_KEY，无法签名应用内更新包"
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "缺少 GitHub Secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD，无法签名应用内更新包"
          }

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build backend sidecar
        shell: pwsh
        run: ./scripts/build_backend.ps1

      - name: Smoke test backend startup
        shell: pwsh
        run: ./scripts/smoke_backend.ps1

      - name: Build frontend
        shell: pwsh
        run: ./scripts/build_frontend.ps1

      - name: Copy sidecar with target triple
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item backend/dist/mangatrans-backend.exe `
            src-tauri/binaries/mangatrans-backend-x86_64-pc-windows-msvc.exe -Force

      - name: Tauri build
        shell: bash
        working-directory: src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PFX_B64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
          WINDOWS_SIGN_TIMESTAMP_URL: http://timestamp.digicert.com
        run: |
          set -o pipefail
          # 有证书时让 Tauri 在打包阶段签名主程序、sidecar、卸载器与安装器；
          # 只签最后的 setup.exe 无法避免已安装 exe 被 Defender/SmartScreen 拦截。
          if [ -n "$PFX_B64" ] && [ -n "$PFX_PASS" ]; then
            ../frontend/node_modules/.bin/tauri build --config tauri.signing.conf.json 2>&1 | tee tauri-build.log
          else
            ../frontend/node_modules/.bin/tauri build 2>&1 | tee tauri-build.log
          fi

      - name: Verify installer end-to-end
        shell: pwsh
        env:
          REQUIRE_SIGNATURE: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 != '' }}
        run: |
          $installer = Get-ChildItem -LiteralPath "src-tauri/target/release/bundle/nsis" -Filter "*.exe" |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($null -eq $installer) { throw "NSIS installer not found" }
          $installerPath = $installer.FullName
          if ([string]::IsNullOrWhiteSpace($installerPath) -or -not (Test-Path -LiteralPath $installerPath)) {
            throw "NSIS installer path is empty or missing: $installerPath"
          }
          Write-Host "Testing installer: $installerPath"
          ./scripts/test_windows_installer.ps1 -Installer $installerPath

      - name: Package portable zip
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item src-tauri/target/release/mangatrans.exe portable/
          # Tauri 运行时按 sidecar 名称查找 mangatrans-backend.exe，便携包不能带 target triple 后缀
          Copy-Item src-tauri/binaries/mangatrans-backend-x86_64-pc-windows-msvc.exe portable/mangatrans-backend.exe
          $readme = @(
            "MangaTrans portable test build (v${env:TAG})",
            "解压后直接运行 mangatrans.exe，无需安装。",
            "默认数据目录：%APPDATA%\com.mangatrans.desktop",
            "隔离测试数据可设置环境变量 MT_DATA_DIR 指向任意目录。"
          )
          Set-Content -Encoding UTF8 -Path portable/README.txt -Value $readme
          Compress-Archive -Path portable/* -DestinationPath "mangatrans_${env:TAG}_portable_x64.zip"

      - name: Generate SHA-256
        shell: pwsh
        run: |
          Get-FileHash src-tauri/target/release/bundle/nsis/*.exe, mangatrans_*_portable_x64.zip -Algorithm SHA256 `
            | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } > checksums.txt
          Get-Content checksums.txt

      - name: Generate updater manifest
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem -LiteralPath "src-tauri/target/release/bundle/nsis" -Filter "*.exe" |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($null -eq $installer) { throw "NSIS installer not found" }
          $sigPath = "$($installer.FullName).sig"
          if (-not (Test-Path -LiteralPath $sigPath)) {
            throw "Updater signature missing: $sigPath"
          }
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $version = [string]$config.version
          $signature = (Get-Content -LiteralPath $sigPath -Raw).Trim()
          $downloadUrl = "https://github.com/$env:REPO/releases/download/$env:TAG/$($installer.Name)"
          $manifest = [ordered]@{
            version = $version
            notes = "MangaTrans v$version"
            pub_date = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url = $downloadUrl
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 latest.json
          Get-Content latest.json

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-failure-logs
          path: |
            src-tauri/tauri-build.log
            backend/dist
          if-no-files-found: ignore

      - name: Remove stale release for same tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          # 首次发版不存在旧 Release：gh release view 返回非零是正常分支，
          # 不能被 PowerShell 的原生命令错误策略当成步骤失败。
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          gh release view $tag --repo $repo 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --repo $repo --yes
            if ($LASTEXITCODE -ne 0) { throw "Failed to delete stale release $tag" }
            Write-Host "Deleted stale release $tag"
          } else {
            Write-Host "No stale release for $tag"
          }
          $global:LASTEXITCODE = 0
          exit 0

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            mangatrans_*_portable_x64.zip
            checksums.txt
            latest.json
