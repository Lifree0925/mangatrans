name: release-windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build backend sidecar
        shell: pwsh
        run: ./scripts/build_backend.ps1

      - name: Build frontend
        shell: pwsh
        run: ./scripts/build_frontend.ps1

      - name: Copy sidecar with target triple
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item backend/dist/mangatrans-backend/mangatrans-backend.exe `
            src-tauri/binaries/mangatrans-backend-x86_64-pc-windows-msvc.exe -Force

      - name: Tauri build
        shell: bash
        working-directory: src-tauri
        run: |
          set -o pipefail
          ../frontend/node_modules/.bin/tauri build 2>&1 | tee tauri-build.log


      - name: Sign installer (skip if no certificate secrets)
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $exe) { throw "未找到 NSIS 安装包" }
          if ($env:PFX_B64 -and $env:PFX_PASS) {
            $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
            $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kitsin" -Recurse -Filter signtool.exe |
              Where-Object { $_.FullName -match 'x64' } | Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { throw "未找到 signtool.exe" }
            & $signtool.FullName sign /f $pfx /p $env:PFX_PASS /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $exe.FullName
            & $signtool.FullName verify /pa $exe.FullName
            Write-Host "已签名: $($exe.Name)"
          } else {
            Write-Host "未配置签名证书 Secrets，跳过签名"
          }

      - name: Generate SHA-256
        shell: pwsh
        run: |
          Get-FileHash src-tauri/target/release/bundle/nsis/*.exe -Algorithm SHA256 `
            | ForEach-Object { "$($_.Hash)  $($_.Path)" } > checksums.txt

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            checksums.txt
