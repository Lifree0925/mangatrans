name: release-windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build backend sidecar
        shell: pwsh
        run: ./scripts/build_backend.ps1

      - name: Build frontend
        shell: pwsh
        run: ./scripts/build_frontend.ps1

      - name: Copy sidecar with target triple
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item backend/dist/mangatrans-backend/mangatrans-backend.exe `
            src-tauri/binaries/mangatrans-backend-x86_64-pc-windows-msvc.exe -Force

      - name: Tauri build
        shell: bash
        working-directory: src-tauri
        run: |
          set -o pipefail
          ../frontend/node_modules/.bin/tauri build 2>&1 | tee tauri-build.log

      - name: Upload build log on failure
        if: failure()
        shell: bash
        run: |
          cp src-tauri/tauri-build.log tauri-build.log || true
          git config user.name github-actions
          git config user.email actions@github.com
          git add tauri-build.log
          git commit -m "ci: tauri build log $(date -u +%Y%m%d%H%M%S)"
          git push origin HEAD:build-logs

      - name: Generate SHA-256
        shell: pwsh
        run: |
          Get-FileHash src-tauri/target/release/bundle/nsis/*.exe -Algorithm SHA256 `
            | ForEach-Object { "$($_.Hash)  $($_.Path)" } > checksums.txt

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            checksums.txt
